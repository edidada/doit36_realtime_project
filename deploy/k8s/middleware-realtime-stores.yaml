apiVersion: v1
kind: ConfigMap
metadata:
  name: business-hbase-conf
  namespace: middleware
data:
  hbase-site.xml: |-
    <configuration>
      <property><name>hbase.rootdir</name><value>file:///data/root</value></property>
      <property><name>hbase.cluster.distributed</name><value>false</value></property>
      <property><name>hbase.zookeeper.quorum</name><value>192.168.31.211</value></property>
      <property><name>hbase.zookeeper.property.clientPort</name><value>2181</value></property>
      <property><name>hbase.zookeeper.property.clientPortAddress</name><value>0.0.0.0</value></property>
      <property><name>hbase.zookeeper.property.dataDir</name><value>/data/zookeeper</value></property>
      <property><name>hbase.master.hostname</name><value>192.168.31.211</value></property>
      <property><name>hbase.regionserver.hostname</name><value>192.168.31.211</value></property>
      <property><name>hbase.unsafe.stream.capability.enforce</name><value>false</value></property>
    </configuration>
  log4j.properties: |-
    log4j.rootLogger=INFO,console
    log4j.appender.console=org.apache.log4j.ConsoleAppender
    log4j.appender.console.layout=org.apache.log4j.PatternLayout
    log4j.appender.console.layout.ConversionPattern=%d %-5p %c: %m%n
---
apiVersion: v1
kind: Service
metadata:
  name: business-hbase
  namespace: middleware
  labels: {app: business-hbase, app.kubernetes.io/component: hbase}
spec:
  selector: {app: business-hbase}
  ports:
    - {name: zookeeper, port: 2181, targetPort: 2181}
    - {name: master, port: 16000, targetPort: 16000}
    - {name: regionserver, port: 16020, targetPort: 16020}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-hbase
  namespace: middleware
  labels: {app: business-hbase, app.kubernetes.io/component: hbase}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: business-hbase}}
  template:
    metadata:
      labels: {app: business-hbase, app.kubernetes.io/component: hbase}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/hostname: k3s-worker1}
      containers:
        - name: business-hbase
          image: docker.m.daocloud.io/library/eclipse-temurin:11-jdk-jammy
          imagePullPolicy: Never
          command: [bash, -ec, "mkdir -p /data/logs; exec /opt/hbase/bin/hbase --config /etc/hbase master start"]
          env:
            - {name: HBASE_HEAPSIZE, value: 768M}
            - {name: HBASE_LOG_DIR, value: /data/logs}
            - {name: HBASE_PID_DIR, value: /tmp}
          ports:
            - {containerPort: 2181}
            - {containerPort: 16000}
            - {containerPort: 16020}
            - {containerPort: 16010}
          readinessProbe:
            tcpSocket: {port: 2181}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {cpu: "2", memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: distribution, mountPath: /opt/hbase, readOnly: true}
            - {name: conf, mountPath: /etc/hbase, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: business-hbase-data}}
        - name: distribution
          hostPath: {path: /var/lib/doit36/hbase-2.4.18, type: Directory}
        - {name: conf, configMap: {name: business-hbase-conf}}
---
apiVersion: v1
kind: Service
metadata:
  name: business-doris-fe
  namespace: middleware
  labels: {app: business-doris-fe, app.kubernetes.io/component: doris-fe}
spec:
  selector: {app: business-doris-fe}
  ports:
    - {name: mysql, port: 9030, targetPort: 9030}
    - {name: http, port: 8030, targetPort: 8030}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-doris-fe
  namespace: middleware
  labels: {app: business-doris-fe, app.kubernetes.io/component: doris-fe}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: business-doris-fe}}
  template:
    metadata:
      labels: {app: business-doris-fe, app.kubernetes.io/component: doris-fe}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/hostname: k3s-worker2}
      containers:
        - name: business-doris-fe
          image: docker.m.daocloud.io/apache/doris:fe-2.1.8
          imagePullPolicy: Never
          command: [bash, -ec, 'ulimit -n 65535; sed -i -E "s/-Xmx[0-9]+[gGmM]/-Xmx1024m/g; s/-Xms[0-9]+[gGmM]/-Xms512m/g" /opt/apache-doris/fe/conf/fe.conf; echo "priority_networks = 192.168.31.0/24" >> /opt/apache-doris/fe/conf/fe.conf; exec /opt/apache-doris/fe/bin/start_fe.sh --console']
          ports:
            - {containerPort: 9030}
            - {containerPort: 8030}
            - {containerPort: 9010}
            - {containerPort: 9020}
          readinessProbe:
            tcpSocket: {port: 9030}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/apache-doris/fe/doris-meta}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: business-doris-fe-data}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-doris-be
  namespace: middleware
  labels: {app: business-doris-be, app.kubernetes.io/component: doris-be}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: business-doris-be}}
  template:
    metadata:
      labels: {app: business-doris-be, app.kubernetes.io/component: doris-be}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/hostname: k3s-worker2}
      containers:
        - name: business-doris-be
          image: docker.m.daocloud.io/apache/doris:fe-2.1.8
          imagePullPolicy: Never
          command: [bash, -ec, 'ulimit -n 65535; printf "\\npriority_networks = 192.168.31.0/24\\nmem_limit = 2G\\n" >> /opt/apache-doris/be/conf/be.conf; exec /opt/apache-doris/be/bin/start_be.sh --console']
          ports:
            - {containerPort: 9050}
            - {containerPort: 8040}
            - {containerPort: 9060}
            - {containerPort: 8060}
          readinessProbe:
            tcpSocket: {port: 9050}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 750m, memory: 3Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: noavx-be, mountPath: /opt/apache-doris/be}
            - {name: data, mountPath: /opt/apache-doris/be/storage}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: business-doris-be-data}}
        - name: noavx-be
          hostPath: {path: /var/lib/doit36/apache-doris-2.1.8-bin-x64-noavx2/be, type: Directory}
