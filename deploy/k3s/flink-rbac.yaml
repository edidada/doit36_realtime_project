apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: doit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: doit
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - configmaps
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: doit
subjects:
- kind: ServiceAccount
  name: flink
  namespace: doit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
