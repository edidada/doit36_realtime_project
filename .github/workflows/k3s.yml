name: Proxmox K3s Flink Image

on:
  push:
    branches: [k3s]
    paths:
      - '.github/workflows/k3s.yml'
      - 'deploy/k3s/**'
      - 'scripts/**'
      - 'docs/k3s-deployment.md'
      - 'pom.xml'
      - '**/pom.xml'
      - '**/src/**'
  workflow_dispatch:
    inputs:
      runner_os:
        description: '构建平台；默认同时验证 Linux 和 Intel macOS，Windows 不参与'
        required: true
        default: both
        type: choice
        options:
          - both
          - macos-15-intel
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
      java_version:
        description: 'Temurin LTS JDK version; used for both build and image runtime'
        required: true
        default: '17'
        type: choice
        options:
          - '17'
          - '21'
          - '25'

permissions:
  contents: read

jobs:
  build-image:
    name: K3s image (${{ matrix.os }}, JDK ${{ inputs.java_version || '17' }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.runner_os == '' || inputs.runner_os == 'both') && '["ubuntu-24.04","macos-15-intel"]' || format('["{0}"]', inputs.runner_os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK ${{ inputs.java_version || '17' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}
          cache: maven

      - name: Show runner disk space
        run: df -h

      - name: Install Linux build and container runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libseccomp-dev podman
          # The AppArmor profile for /usr/bin/podman does not cover our binary.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Ubuntu 22.04 ships a CNI-based runtime; newer images use Netavark.
          if [[ '${{ matrix.os }}' == ubuntu-22.04 ]]; then
            mkdir -p "$RUNNER_TEMP/doit36-containers"
            printf '[network]\nnetwork_backend = "cni"\n' > "$RUNNER_TEMP/doit36-containers/containers.conf"
            echo "CONTAINERS_CONF=$RUNNER_TEMP/doit36-containers/containers.conf" >> "$GITHUB_ENV"
          fi

      - name: Install macOS QEMU
        if: runner.os == 'macOS'
        run: brew list qemu >/dev/null 2>&1 || brew install qemu

      - name: Download and compile Podman 4.9.5
        run: bash scripts/build-podman.sh

      - name: Build Flink image with compiled Podman and export tar
        env:
          IMAGE_NAMESPACE: doit36
          IMAGE_TAG: ${{ github.run_number }}-${{ matrix.os }}-jdk${{ inputs.java_version || '17' }}
          RUNTIME_JDK: ${{ inputs.java_version || '17' }}
          IMAGE_PLATFORM: linux/amd64
          PODMAN_MACHINE_IMAGE: https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/39.20240322.3.0/x86_64/fedora-coreos-39.20240322.3.0-qemu.x86_64.qcow2.xz
          INIT_PODMAN_MACHINE: ${{ runner.os == 'macOS' && 'true' || 'false' }}
        run: bash scripts/build-image.sh

      - name: List exported image tar
        run: |
          set -euo pipefail
          echo '== deploy/k3s/output =='
          ls -lh deploy/k3s/output/
          echo '== total size =='
          du -sh deploy/k3s/output/

      - name: List local image
        env:
          CONTAINERS_MACHINE_PROVIDER: qemu
          CONTAINER_CONNECTION: ${{ runner.os == 'macOS' && 'doit36-build' || '' }}
        run: .artifacts/podman-build/bin/podman images --filter reference='docker.io/doit36/*'

      - name: Upload K3s image tar
        uses: actions/upload-artifact@v4
        with:
          name: k3s-flink-image-${{ github.run_number }}-${{ matrix.os }}-jdk${{ inputs.java_version || '17' }}
          path: deploy/k3s/output/*.tar
          if-no-files-found: error

      - name: Stop CI Podman machine
        if: always() && runner.os == 'macOS'
        env:
          CONTAINERS_MACHINE_PROVIDER: qemu
        run: |
          if [[ -x .artifacts/podman-build/bin/podman ]] && \
             .artifacts/podman-build/bin/podman machine inspect doit36-build >/dev/null 2>&1; then
            .artifacts/podman-build/bin/podman machine stop doit36-build
          fi
